# Optional manually provisioned, paid Render private worker.
# This file is deliberately NOT appended to the root render.yaml (which
# auto-provisions media services): deployment requires explicit operator action.
services:
  - type: worker
    name: env-world-lab-science-worker
    runtime: docker
    dockerfilePath: ./infra/world-lab-worker/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: WORLD_LAB_JOBS_ENABLED
        value: "false"
      - key: VITE_AUTH_ENABLED
        value: "false"
