name: Refresh ecosystem lockfile

on:
  push:
    branches:
      - feat/enV-ecosystem-foundation-20261030
    paths:
      - package.json
      - .github/workflows/refresh-ecosystem-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ecosystem branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Re-resolve the lockfile from the reviewed package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the generated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "The lockfile is already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh ecosystem lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
