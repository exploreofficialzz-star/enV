name: Production Check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure production media runtime
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Using runner-provided FFmpeg: $(command -v ffmpeg)"
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg is not present; installing it with bounded package-manager retries."
            sudo timeout 180s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo timeout 180s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends ffmpeg
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start browser-audit server
        run: |
          npm run dev > /tmp/enV-dev.log 2>&1 &
          echo $! > /tmp/enV-dev.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/enV-dev.log
          exit 1

      - name: Verify production
        env:
          BROWSER_AUDIT_SAMPLE: 250
        run: npm run verify
