name: Production Check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Ensure production media runtime
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "Using runner-provided FFmpeg: $(command -v ffmpeg)"
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg is not present; installing it with retries and network timeouts."
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 update
            sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 -o Acquire::https::Timeout=60 install -y --no-install-recommends ffmpeg
            ffmpeg -version | head -n 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start browser-audit server
        run: |
          npm run dev > /tmp/enV-dev.log 2>&1 &
          echo $! > /tmp/enV-dev.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/enV-dev.log
          exit 1

      - name: Configure Studio browser
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi

      - name: Check Studio in phone, landscape, tablet and desktop layouts
        run: npm run audit:ux-ui-studio:browser

      - name: Upload Studio visual checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-ui-studio-browser-audit
          path: /tmp/env-ux-ui-studio-audit
          if-no-files-found: ignore

      - name: Verify production
        env:
          BROWSER_AUDIT_SAMPLE: 250
        run: npm run verify
