name: Production Check

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: production-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install production media runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Start browser-audit server
        run: |
          npm run dev > /tmp/enV-dev.log 2>&1 &
          echo $! > /tmp/enV-dev.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/enV-dev.log
          exit 1

      - name: Verify production
        env:
          BROWSER_AUDIT_SAMPLE: 250
        run: npm run verify
