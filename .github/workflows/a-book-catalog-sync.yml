name: A book — regenerate shared native catalog

on:
  push:
    branches: [feature/a-book-architecture]
    paths:
      - "scripts/export-native-catalog.mjs"
      - "src/data/catalog.ts"
      - "src/data/categories.ts"
      - "apps/android/native-family-coverage/**"
      - "apps/ios/native-family-coverage/**"

permissions:
  contents: write
  actions: write

concurrency:
  group: a-book-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate catalog and execution inventory
        run: npm run export:native-catalog

      - name: Commit generated catalog when it changes
        id: generated
        shell: bash
        run: |
          if git diff --quiet -- apps/shared/catalog.json apps/shared/native-engine-inventory.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/shared/catalog.json apps/shared/native-engine-inventory.json
          git commit -m "chore(a-book): regenerate shared native catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch Android and iOS validation on the generated commit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in android-build.yml ios-build.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d '{"ref":"${GH_REF_NAME}"}'
          done
