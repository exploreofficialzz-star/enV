name: Design category — standalone engine tests

on:
  push:
    branches:
      - feat/design-quality-mainline-20261101
  pull_request:
    paths:
      - "src/components/engines/color-engine.tsx"
      - "src/components/engines/cssgen-engine.tsx"
      - "src/lib/engines/**"
      - "scripts/check-design.mjs"
      - "scripts/audit-design-category-browser.mjs"
      - "src/components/tools/design-category-explorer.tsx"
      - ".github/workflows/accessibility-phase8.yml"
      - "scripts/catalog-reader.mjs"
      - "src/data/catalog.ts"
      - "package.json"
      - ".github/workflows/design-category-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design-engine-tests:
    name: Design engine unit tests and full catalogue audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Verify Node supports built-in TypeScript stripping
        run: node --version
      - name: Run Design engine unit tests
        run: >-
          node --experimental-strip-types --test
          src/lib/engines/css-gradient.test.ts
          src/lib/engines/css-shadow.test.ts
          src/lib/engines/css-text-shadow.test.ts
          src/lib/engines/design-component-a11y.test.ts
          src/lib/engines/css-border.test.ts
          src/lib/engines/design-layer-utils.test.ts
          src/lib/engines/palette-image.test.ts
          src/lib/engines/design-palette.test.ts
          src/lib/engines/design-color.test.ts
          src/lib/engines/svg-generators.test.ts
          src/lib/engines/svg-backgrounds.test.ts
          src/lib/engines/design-contrast.test.ts
          src/lib/engines/design-explorer.test.ts
          src/lib/production-notice.test.ts
      - name: Audit every Design catalogue entry and implementation gate
        run: node scripts/check-design.mjs
      - name: Verify Web Design availability and native production boundaries
        run: npm run check:production-gating

  design-browser-acceptance:
    name: Rendered Design browser and responsive acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build production Web application
        run: npm run build
      - name: Typecheck Web application
        run: npm run typecheck
      - name: Lint Web application
        run: npm run lint
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start production preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 8080 --strictPort > "$RUNNER_TEMP/env-design-preview.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/env-design-preview.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/ > /dev/null; then
              echo "Production preview is responding."
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/env-design-preview.log"
          echo "Production preview did not become ready." >&2
          exit 1
      - name: Audit every Design route, palette asset export, page preview and gradient reorder
        run: npm run audit:design:browser -- --browser=all --base-url=http://127.0.0.1:8080
      - name: Upload Design browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: env-design-browser-evidence-${{ github.sha }}
          path: artifacts/design-category/
          if-no-files-found: ignore
