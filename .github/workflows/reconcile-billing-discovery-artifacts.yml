name: One-time billing and discovery artifact reconciliation

on:
  push:
    branches:
      - feat/per-tool-cost-profiles-20261125
    paths:
      - .github/workflows/reconcile-billing-discovery-artifacts.yml

permissions:
  contents: write

concurrency:
  group: enV-billing-discovery-artifact-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the billing branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate native inventories and per-tool billing profiles
        run: |
          npm run export:native-catalog
          npm run generate:billing-profiles
          npm run check:native-discovery
          npm run export:native-execution-matrix
          npm run generate:seo
          npm run discovery:seo-offline

      - name: Inspect the candidate discovery delta before accepting a new baseline
        shell: bash
        run: |
          set -euo pipefail
          cp audit/discovery/discovery-baseline.json /tmp/discovery-baseline-before.json
          cp audit/discovery/discovery-inventory.json /tmp/discovery-inventory-before.json

          # The inventory and report are written even when the ratchet reports the
          # expected one-count regression. Do not accept it until the exact delta is checked.
          set +e
          npm run discovery:inventory
          inventory_status=$?
          set -e
          if [ "$inventory_status" -gt 1 ]; then
            echo "Discovery inventory generation failed."
            exit "$inventory_status"
          fi

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const beforeBaseline = JSON.parse(fs.readFileSync("/tmp/discovery-baseline-before.json", "utf8"));
          const before = JSON.parse(fs.readFileSync("/tmp/discovery-inventory-before.json", "utf8"));
          const current = JSON.parse(fs.readFileSync("audit/discovery/discovery-inventory.json", "utf8"));

          const beforeIds = new Set(before.records.map((record) => record.id));
          const currentIds = new Set(current.records.map((record) => record.id));
          const addedIds = [...currentIds].filter((id) => !beforeIds.has(id)).sort();
          const removedIds = [...beforeIds].filter((id) => !currentIds.has(id)).sort();
          const expectedAddedIds = ["scene-studio"];
          const expectedRemovedIds = ["video-link-screen-recording"];
          if (JSON.stringify(addedIds) !== JSON.stringify(expectedAddedIds) ||
              JSON.stringify(removedIds) !== JSON.stringify(expectedRemovedIds)) {
            throw new Error("Discovery identity delta does not match the reviewed source changes. Added="
              + JSON.stringify(addedIds) + "; removed=" + JSON.stringify(removedIds));
          }

          const sceneStudio = current.records.find((record) => record.id === "scene-studio");
          const nativeInventory = JSON.parse(fs.readFileSync("apps/shared/native-engine-inventory.json", "utf8"));
          if (!sceneStudio || sceneStudio.status === "planned" ||
              !sceneStudio.reasons?.includes("NATIVE_WEB_ONLY_ACTIVE") ||
              nativeInventory.androidToolIds.includes("scene-studio") ||
              nativeInventory.iosToolIds.includes("scene-studio")) {
            throw new Error("Scene Studio must be active in Web discovery and remain explicitly outside native Android/iOS inventory until native screens are implemented.");
          }

          const isNativeWebOnlyActive = (record) =>
            record.status !== "planned" && record.reasons?.includes("NATIVE_WEB_ONLY_ACTIVE");
          const isNativeWebOnlyPlanned = (record) =>
            record.status === "planned" && record.reasons?.includes("NATIVE_WEB_ONLY_PLANNED");
          const beforeIdsForGap = new Set(before.records.map((record) => record.id));
          const beforeActive = new Set(before.records.filter(isNativeWebOnlyActive).map((record) => record.id));
          const currentActive = new Set(current.records.filter(isNativeWebOnlyActive).map((record) => record.id));
          const beforePlanned = new Set(before.records.filter(isNativeWebOnlyPlanned).map((record) => record.id));
          const currentPlanned = new Set(current.records.filter(isNativeWebOnlyPlanned).map((record) => record.id));
          const unexpectedActivePromotions = [...currentActive]
            .filter((id) => beforeIdsForGap.has(id) && !beforeActive.has(id)).sort();
          const unexpectedExistingPlanChanges = [...beforePlanned]
            .filter((id) => currentIds.has(id) && !currentPlanned.has(id)).sort();

          const previousGap = beforeBaseline.gaps.NATIVE_WEB_ONLY_ACTIVE;
          const currentGapCounts = {
            PLANNED_IN_SEARCHABLE: current.lifecycle.plannedInSearchable.length,
            EMPTY_CATEGORY: current.categories.emptyCategoryIds.length,
            NATIVE_MATRIX_NAME_DRIFT: current.native.matrix.rowsWithNameDrift.length,
            NATIVE_WEB_ONLY_ACTIVE: currentActive.size,
            DUPLICATE_DISPLAY_NAMES: current.ranking.duplicateNameGroupCount,
            UNDIFFERENTIATED_POPULARITY: current.ranking.topPopularityValueShare >= 0.4 ? 1 : 0,
            SEARCHABLE_NOT_ON_ANY_CATEGORY_ROUTE: current.categories.uncategorizedSearchableIds.length,
            TOOLS_IN_MULTIPLE_CATEGORY_ROUTES: current.categories.toolsInMultipleCategoryRoutes.length
          };
          const actualGap = currentGapCounts.NATIVE_WEB_ONLY_ACTIVE;
          const expectedActivePromotions = ["scene-studio"];
          if (actualGap !== previousGap + 1 ||
              unexpectedActivePromotions.length !== 0 ||
              unexpectedExistingPlanChanges.length !== 0) {
            throw new Error("The only accepted active-Web gap increase is the new Scene Studio inventory record. "
              + "Unexpected active promotions=" + JSON.stringify(unexpectedActivePromotions)
              + "; unexpected existing plan changes=" + JSON.stringify(unexpectedExistingPlanChanges)
              + "; gap " + previousGap + " -> " + actualGap);
          }

          for (const [code, previous] of Object.entries(beforeBaseline.gaps)) {
            const actual = currentGapCounts[code];
            if (actual === undefined || (code !== "NATIVE_WEB_ONLY_ACTIVE" && actual > previous)) {
              throw new Error("Unexpected discovery gap increase for " + code
                + ": previous=" + previous + "; actual=" + actual);
            }
          }

          fs.writeFileSync("/tmp/discovery-reviewed-change.json", JSON.stringify({
            addedIds,
            removedIds,
            toolId: sceneStudio.id,
            toolName: sceneStudio.name,
            previousActiveGap: previousGap,
            currentActiveGap: actualGap
          }, null, 2));
          console.log("Verified reviewed discovery delta: Scene Studio is the single added stable ID and "
            + "video-link-screen-recording is the single retired stable ID. No existing tool changed platform/status classification, "
            + "and no other registered gap grew.");
          NODE

      - name: Accept only the reviewed discovery baseline and refresh generated records
        run: |
          npm run discovery:inventory -- --update-baseline
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const change = JSON.parse(fs.readFileSync("/tmp/discovery-reviewed-change.json", "utf8"));
          const path = "audit/discovery/discovery-baseline.json";
          const baseline = JSON.parse(fs.readFileSync(path, "utf8"));
          baseline.note = "Reviewed 2026-11-26: Scene Studio (" + change.toolId
            + ") is present in canonical Web discovery as an active Web-only tool and is not in the native Android/iOS inventory. "
            + "The NATIVE_WEB_ONLY_ACTIVE registered gap increased from " + change.previousActiveGap
            + " to " + change.currentActiveGap + ". The only stable-ID changes were the addition of scene-studio and the reviewed retirement of video-link-screen-recording. "
            + "No other existing tool changed platform/status classification, and every other registered gap stayed level or improved. "
            + "This records a platform-coverage gap; it is not native functional acceptance evidence or billing approval.";
          fs.writeFileSync(path, JSON.stringify(baseline, null, 1) + "\n");
          NODE
          npm run discovery:inventory
          npm run discovery:knowledge-index
          npm run discovery:search-golden
          npm run discovery:seo-offline
          npm run discovery:check

      - name: Commit generated artifacts and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Normalize the generated Markdown report so diff --check sees one final newline.
          perl -0pi -e 's/\n+\z/\n/' audit/discovery/DISCOVERY-RECONCILIATION-REPORT.md
          git add -A
          git rm .github/workflows/reconcile-billing-discovery-artifacts.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(billing): refresh generated pricing and discovery records"
          git push origin "HEAD:${GITHUB_REF_NAME}"
