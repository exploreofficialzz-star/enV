name: Billing integration validation

on:
  pull_request:
    paths:
      - "src/lib/billing/**"
      - "src/routes/wallet.tsx"
      - "src/components/billing/token-dashboard.tsx"
      - "server/routes/api/billing/**"
      - "migrations/0009_billing_refund_dispute_reconciliation.sql"
      - "scripts/check-billing.mjs"
      - "docs/billing-operations-runbook.md"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/billing-validation.yml"

permissions:
  contents: read

concurrency:
  group: billing-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  billing:
    name: Billing checks, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run billing and payment integration checks
        run: npm run check:billing

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
