name: Remove misplaced Design and Build calculator records

on:
  push:
    branches: [fix/remove-misplaced-design-build-calculators]
    paths:
      - ".github/workflows/calculator-catalog-sync.yml"
      - "src/data/math-expansion.json"
      - "scripts/check-calculators.mjs"

permissions:
  contents: write
  actions: write

concurrency:
  group: calculator-catalog-cleanup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the cleanup branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate the canonical Web catalogue
        run: node scripts/gen-catalog.mjs

      - name: Regenerate native engine data and platform coverage
        run: npm run export:native-engine-data

      - name: Regenerate shared offline catalog and native inventory
        run: npm run export:native-catalog

      - name: Regenerate cross-platform execution matrix
        run: npm run export:native-execution-matrix

      - name: Verify calculator categorization and catalog integrity
        run: |
          node scripts/check-calculators.mjs
          npm run check:calculators:registry
          node scripts/check-native-calculators.mjs
          node scripts/check-native-coverage.mjs --strict
          node scripts/check-native-math-exercises.mjs
          node scripts/check-catalog.mjs

      - name: Verify Web types, lint and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit regenerated catalogue data
        id: generated
        shell: bash
        run: |
          set -euo pipefail
          generated_paths=(
            src/data/catalog.ts
            apps/shared
            apps/android/app/src/main/java/com/chastech/env/engine/NativeEngineData.kt
            apps/android/native-family-coverage
            apps/ios/enV/NativeEngineData.swift
            apps/ios/native-family-coverage
          )
          if git diff --quiet -- "${generated_paths[@]}"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generated_paths[@]}"
          git commit -m "chore(catalog): regenerate after removing misplaced Design/Build tools"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch native Android and iOS build validation
        if: steps.generated.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for workflow in android-build.yml ios-build.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -d "{\"ref\":\"\${GH_REF_NAME}\"}"
          done
