name: Temporary World Lab dependency lock refresh

on:
  push:
    branches: [feat/world-lab-foundation-20261030]
    paths:
      - "package.json"
      - ".github/workflows/refresh-world-lab-lock.yml"

permissions:
  contents: write

concurrency:
  group: world-lab-lock-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Resolve real patched dependency graph
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Verify no vulnerable dependencies before recording lock
        run: npm audit --audit-level=moderate
      - name: Persist reproducible package lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lock is already synchronized."
            exit 0
          fi
          git commit -m "fix(deps): lock patched minimatch dependency tree"
          git push origin HEAD:feat/world-lab-foundation-20261030
