name: Video Link Screen Recording — native compile verification

on:
  push:
    branches:
      - main
      - feat/video-link-screen-recording-20261117
    paths:
      - ".github/workflows/video-link-native-ci.yml"
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/shared/**"
      - "src/lib/registry.ts"
      - "src/lib/media/video-link-recording.ts"
      - "src/lib/media/video-link-recording.test.ts"
      - "src/data/**"
      - "scripts/check-video-link-recorder.mjs"
      - "scripts/export-native-catalog.mjs"
      - "scripts/export-native-execution-matrix.mjs"
      - "package.json"
      - "package-lock.json"

  pull_request:
    paths:
      - ".github/workflows/video-link-native-ci.yml"
      - "apps/android/**"
      - "apps/ios/**"
      - "apps/shared/**"
      - "src/lib/registry.ts"
      - "src/lib/media/video-link-recording.ts"
      - "src/lib/media/video-link-recording.test.ts"
      - "src/data/**"
      - "scripts/check-video-link-recorder.mjs"
      - "scripts/export-native-catalog.mjs"
      - "scripts/export-native-execution-matrix.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: video-link-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile and test Kotlin implementation
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Regenerate native catalog and execution evidence
        run: |
          npm run export:native-catalog
          npm run export:native-engine-data
          npm run export:native-execution-matrix
          npm run check:native-icons
          npm run check:native-calculators
          npm run check:native-coverage
          npm run check:native-executability
      - name: Verify original post screen-recording policy and platform wiring
        run: |
          node --experimental-strip-types --test src/lib/media/video-link-recording.test.ts
          node scripts/check-video-link-recorder.mjs
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Compile Kotlin and run Android unit tests and lint
        working-directory: apps/android
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace test lint

  ios:
    name: Compile and test Swift implementation
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        working-directory: ${{ github.workspace }}
        run: npm ci
      - name: Regenerate native catalog and execution evidence
        working-directory: ${{ github.workspace }}
        run: |
          npm run export:native-catalog
          npm run export:native-engine-data
          npm run export:native-execution-matrix
          npm run check:native-icons
          npm run check:native-calculators
          npm run check:native-coverage
          npm run check:native-executability
      - name: Record iOS build toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcodebuild -showsdks | grep -E 'iOS|iOS Simulator'
      - name: Build SwiftUI app for iOS Simulator
        run: |
          xcodebuild \
            -project enV.xcodeproj \
            -scheme enV \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/env-ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Select an available iPhone Simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/env-simulators.json"
          simulator_id="$(python3 - "$RUNNER_TEMP/env-simulators.json" <<'PY'
          import json, sys
          devices = json.load(open(sys.argv[1], encoding='utf-8')).get('devices', {})
          for runtime, entries in devices.items():
              if 'iOS' not in runtime:
                  continue
              for entry in entries:
                  if entry.get('isAvailable', True) and entry.get('name', '').startswith('iPhone'):
                      print(entry['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone Simulator found')
          PY
          )"
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Launch native iOS app on simulator
        run: |
          xcrun simctl bootstatus "$IOS_SIMULATOR_ID" -b
          app="$RUNNER_TEMP/env-ios-derived-data/Build/Products/Release-iphonesimulator/enV.app"
          test -d "$app"
          xcrun simctl install "$IOS_SIMULATOR_ID" "$app"
          xcrun simctl launch "$IOS_SIMULATOR_ID" com.chastech.env
          sleep 3
      - name: Run iOS XCTest suite
        run: |
          xcodebuild \
            -project enV.xcodeproj \
            -scheme enV \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/env-ios-test-derived-data" \
            CODE_SIGNING_ALLOWED=NO \
            test
