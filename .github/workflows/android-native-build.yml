name: Web and Android CI

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "apps/shared/**"
      - "src/**"
      - "server/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vercel.json"
      - ".github/workflows/android-native-build.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "apps/shared/**"
      - "src/**"
      - "server/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vercel.json"
      - ".github/workflows/android-native-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Validate and build web application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install production media runtime
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install locked web dependencies
        run: npm ci
      - name: Audit web dependencies
        run: npm audit --audit-level=moderate
      - name: Build web app
        run: npm run build
      - name: Typecheck web app
        run: npm run typecheck
      - name: Lint web app
        run: npm run lint
      - name: Test web app
        run: npm test

  build-android:
    name: Validate and build native Android app
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Regenerate shared offline catalog
        working-directory: ${{ github.workspace }}
        run: npm run export:native-catalog && git diff --exit-code -- apps/shared/catalog.json apps/shared/native-engine-inventory.json
      - name: Verify native engine and execution coverage
        working-directory: ${{ github.workspace }}
        run: |
          npm run export:native-engine-data
          npm run export:native-execution-matrix
          npm run check:native-calculators
          npm run check:native-coverage
          npm run check:native-executability
          git diff --exit-code -- apps/shared apps/*/native-family-coverage apps/*/native-tool-coverage.txt apps/*/backend-tool-coverage.txt
      - name: Verify shared native brand assets
        working-directory: ${{ github.workspace }}
        run: npm run check:native-icons
      - name: Set up Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
      - name: Run Kotlin unit tests and Android lint
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace test lint
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            keystore_path="$RUNNER_TEMP/env-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            test -s "$keystore_path"
            {
              echo "ANDROID_KEYSTORE_FILE=$keystore_path"
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Production signing configured; release APK/AAB use the stable production key."
          elif [ -z "$ANDROID_KEYSTORE_BASE64" ] && [ -z "$ANDROID_KEYSTORE_PASSWORD" ] && [ -z "$ANDROID_KEY_ALIAS" ] && [ -z "$ANDROID_KEY_PASSWORD" ]; then
            keystore_path="$RUNNER_TEMP/env-ci-test.keystore"
            test_password="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$keystore_path" \
              -storepass "$test_password" -keypass "$test_password" -alias env-ci-test \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=enV CI Test Build, OU=CI, O=enV, C=US"
            {
              echo "ANDROID_KEYSTORE_FILE=$keystore_path"
              echo "ANDROID_KEYSTORE_PASSWORD=$test_password"
              echo "ANDROID_KEY_ALIAS=env-ci-test"
              echo "ANDROID_KEY_PASSWORD=$test_password"
            } >> "$GITHUB_ENV"
            echo "Production signing secrets are absent; the test-only key supports a fresh install, not upgrades."
          else
            echo "Some Android production signing secrets are missing; refusing an incomplete signing configuration." >&2
            exit 1
          fi
      - name: Build signed release APK and AAB
        run: ./gradlew --no-daemon --max-workers=2 --stacktrace :app:assembleRelease :app:bundleRelease
      - name: Verify release APK signature
        working-directory: ${{ github.workspace }}
        run: |
          apk="apps/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
      - name: Upload Android build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: env-android-native-${{ github.sha }}
          path: |
            apps/android/app/build/outputs/apk/release/app-release.apk
            apps/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
