name: One-time source-aligned discovery artifact regeneration

on:
  push:
    branches:
      - main
      - feat/full-public-discovery-audit-20261123
      - feat/discovery-reconcile-scene-studio-20261123
    paths:
      - .github/workflows/regenerate-discovery-artifacts.yml
      - scripts/generate-discovery-inventory.mjs
      - scripts/discovery-inventory-core.mjs

permissions:
  contents: write

concurrency:
  group: enV-discovery-artifact-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate native catalogue and execution inventory
        run: |
          npm run export:native-catalog
          npm run generate:billing-profiles
          npm run check:native-discovery
          npm run export:native-execution-matrix

      - name: Regenerate canonical SEO artifacts
        run: npm run generate:seo

      - name: Verify the exact discovery inventory delta before accepting it
        shell: bash
        run: |
          set -euo pipefail
          cp audit/discovery/discovery-baseline.json /tmp/discovery-baseline-before.json
          cp audit/discovery/discovery-inventory.json /tmp/discovery-inventory-before.json

          # The generator writes the candidate inventory/report before returning its
          # expected COUNT_DRIFT exit status. Do not update the accepted baseline yet.
          set +e
          npm run discovery:inventory
          inventory_status=$?
          set -e
          if [ "$inventory_status" -gt 1 ]; then
            echo "Inventory generation failed for a reason other than its validator result."
            exit "$inventory_status"
          fi

          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const beforeBaseline = JSON.parse(fs.readFileSync("/tmp/discovery-baseline-before.json", "utf8"));
          const beforeInventory = JSON.parse(fs.readFileSync("/tmp/discovery-inventory-before.json", "utf8"));
          const currentInventory = JSON.parse(fs.readFileSync("audit/discovery/discovery-inventory.json", "utf8"));
          const report = fs.readFileSync("audit/discovery/DISCOVERY-RECONCILIATION-REPORT.md", "utf8");

          const beforeIds = new Set(beforeInventory.records.map((record) => record.id));
          const currentIds = new Set(currentInventory.records.map((record) => record.id));
          const removed = [...beforeIds].filter((id) => !currentIds.has(id)).sort();
          const added = [...currentIds].filter((id) => !beforeIds.has(id)).sort();
          const expectedRemoved = ["video-link-screen-recording"];
          const expectedAdded = ["scene-studio"];

          if (JSON.stringify(removed) !== JSON.stringify(expectedRemoved) ||
              JSON.stringify(added) !== JSON.stringify(expectedAdded)) {
            throw new Error("Discovery identity delta differs from the reviewed source change. Removed: "
              + JSON.stringify(removed) + "; added: " + JSON.stringify(added));
          }

          // Scene Studio is an intentional Web-only runtime extension. Its Kotlin/Swift
          // reader and math conformance sources are not full native editing/render/export apps.
          const sceneStudio = currentInventory.records.find((record) => record.id === "scene-studio");
          const expectedSceneRelated = ["video-trimmer", "video-compressor", "video-poster-generator"];
          const sceneRelatedTargets = new Map(currentInventory.records.map((record) => [record.id, record]));
          const registrySource = fs.readFileSync("src/lib/registry.ts", "utf8");
          const sceneRegistryEntry = registrySource.split("const sceneStudioTool: ToolMeta = {")[1]?.split("\\n};")[0] ?? "";
          if (!sceneStudio || sceneStudio.status !== "active" || sceneStudio.kind !== "runtime-extension" ||
              sceneStudio.nativeExecution?.android !== "web-only" || sceneStudio.nativeExecution?.ios !== "web-only" ||
              !sceneStudio.reasons.includes("NATIVE_WEB_ONLY_ACTIVE") ||
              !sceneRegistryEntry.includes('related: ["video-trimmer", "video-compressor", "video-poster-generator"]') ||
              expectedSceneRelated.some((id) => {
                const target = sceneRelatedTargets.get(id);
                return !target || target.status === "planned" || !target.surfaces.searchable;
              })) {
            throw new Error("Scene Studio must be active/Web-only and link to the three verified searchable video workflows.");
          }

          // The removed and added IDs balance each other; all source/runtime/search counts
          // remain stable. This is identity replacement, not a net inventory reduction.
          const expected = {
            sourceRecords: 10001,
            sharedCatalogueRecords: 10001,
            runtimeRecords: 10014,
            searchableRecords: 9979,
            runtimeExtensionRecords: 13,
            virtualStudioRecords: 14,
            runtimePlanned: 260,
            categoryDefinitions: 43
          };
          const changedCounts = Object.keys(beforeBaseline.counts)
            .filter((key) => beforeBaseline.counts[key] !== currentInventory.summary[key])
            .sort();
          if (changedCounts.length !== 0) {
            throw new Error("Unexpected discovery count fields changed: " + JSON.stringify(changedCounts));
          }
          for (const [key, value] of Object.entries(expected)) {
            if (currentInventory.summary[key] !== value) {
              throw new Error("Unexpected " + key + ": " + currentInventory.summary[key] + " (expected " + value + ")");
            }
          }

          const validationSection = report.split("## 8. Validator result")[1]?.split("Registered gaps")[0] ?? "";
          const failures = [...validationSection.matchAll(/^- `([^`]+)`/gm)].map((match) => match[1]);
          if (failures.length !== 1 || failures[0] !== "GAP_REGRESSION") {
            throw new Error("Unexpected inventory validator failures: " + JSON.stringify(failures));
          }

          const currentGaps = new Map();
          for (const line of report.split("\n")) {
            const match = line.match(/^\| `([^`]+)` \| (\d+) \| (\d+) \|$/);
            if (match) currentGaps.set(match[1], Number(match[2]));
          }
          const priorGapCodes = Object.keys(beforeBaseline.gaps).sort();
          const nextGapCodes = [...currentGaps.keys()].sort();
          if (JSON.stringify(priorGapCodes) !== JSON.stringify(nextGapCodes)) {
            throw new Error("The registered discovery gap set changed.");
          }
          for (const [code, prior] of Object.entries(beforeBaseline.gaps)) {
            const current = currentGaps.get(code);
            if (current === undefined) {
              throw new Error("Registered gap disappeared unexpectedly: " + code);
            }
            if (code === "NATIVE_WEB_ONLY_ACTIVE") {
              if (current !== prior + 1) {
                throw new Error("Expected exactly one intentional Web-only addition for Scene Studio; got " + current + " from " + prior);
              }
            } else if (current !== prior) {
              throw new Error("Unexpected registered gap change: " + code + " (before " + prior + ", current " + current + ")");
            }
          }

          console.log("Verified the exact identity swap (removed video-link-screen-recording; added active Web-only scene-studio), unchanged inventory totals, and the single expected native Web-only count increase.");
          NODE

      - name: Accept reviewed counts and regenerate discovery artifacts
        run: |
          npm run discovery:inventory -- --update-baseline
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "audit/discovery/discovery-baseline.json";
          const baseline = JSON.parse(fs.readFileSync(path, "utf8"));
          baseline.note = "Reviewed 2026-11-24: video-link-screen-recording was removed and scene-studio was added as an active runtime extension. Scene Studio is explicitly Web-only until native Android/iOS editing, rendering and export exist; its inclusion explains the one-item increase in NATIVE_WEB_ONLY_ACTIVE. Its related links point to active, searchable video-trimming, compression and poster-generation workflows. The source-derived ID sets, unchanged inventory totals, and every other registered gap were verified. This records inventory identity only; it is not per-tool functional acceptance evidence.";
          fs.writeFileSync(path, JSON.stringify(baseline, null, 1) + "\n");
          NODE
          npm run discovery:inventory
          npm run discovery:knowledge-index
          npm run discovery:search-golden
          npm run discovery:seo-offline
          npm run discovery:check

      - name: Commit only regenerated generated files and remove this one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/shared/catalog.json \
            apps/shared/native-engine-inventory.json \
            apps/shared/native-execution-matrix.json \
            src/data/billing-profile-runtime-extensions.json \
            audit/discovery/discovery-baseline.json \
            audit/discovery/discovery-inventory.json \
            audit/discovery/DISCOVERY-RECONCILIATION-REPORT.md \
            audit/discovery/SEO-OFFLINE-VALIDATION.md \
            audit/discovery/tool-knowledge-index.json \
            audit/discovery/search-eval/native-golden.v1.json \
            public
          git rm .github/workflows/regenerate-discovery-artifacts.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(discovery): reconcile catalogue-derived audit artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
