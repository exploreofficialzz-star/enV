name: One-time source-aligned discovery artifact regeneration

on:
  push:
    branches:
      - feat/full-public-discovery-audit-20261123
    paths:
      - .github/workflows/regenerate-discovery-artifacts.yml

permissions:
  contents: write

concurrency:
  group: enV-discovery-artifact-regeneration
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out discovery branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate native catalogue and execution inventory
        run: |
          npm run export:native-catalog
          npm run generate:billing-profiles
          npm run check:native-discovery
          npm run export:native-execution-matrix

      - name: Regenerate canonical SEO artifacts
        run: npm run generate:seo

      - name: Accept only the confirmed one-record catalogue removal
        shell: bash
        run: |
          cp audit/discovery/discovery-baseline.json /tmp/discovery-baseline-before.json
          npm run discovery:inventory -- --update-baseline
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const before = JSON.parse(fs.readFileSync("/tmp/discovery-baseline-before.json", "utf8"));
          const after = JSON.parse(fs.readFileSync("audit/discovery/discovery-baseline.json", "utf8"));
          const changed = Object.keys(before.counts)
            .filter((key) => before.counts[key] !== after.counts[key])
            .sort();
          const allowed = ["runtimeExtensionRecords", "runtimeRecords", "searchableRecords"];
          if (JSON.stringify(changed) !== JSON.stringify(allowed)) {
            throw new Error("Unexpected discovery count changes: " + changed.join(", "));
          }
          if (JSON.stringify(before.gaps) !== JSON.stringify(after.gaps)) {
            throw new Error("A registered discovery gap changed. Human review is required; baseline not accepted.");
          }
          const expected = {
            runtimeRecords: 10013,
            searchableRecords: 9978,
            runtimeExtensionRecords: 12
          };
          for (const [key, value] of Object.entries(expected)) {
            if (after.counts[key] !== value) {
              throw new Error("Unexpected " + key + ": " + after.counts[key] + " (expected " + value + ")");
            }
          }
          console.log("Accepted the confirmed removal of video-link-screen-recording only; registered discovery gap baselines remain unchanged.");
          NODE

      - name: Generate discovery inventory, knowledge index and search golden
        run: |
          npm run discovery:inventory
          npm run discovery:knowledge-index
          npm run discovery:search-golden
          node --experimental-strip-types --import ./scripts/register-ts-alias.mjs scripts/validate-seo-offline.mjs

      - name: Verify all generated discovery artifacts
        run: npm run discovery:check

      - name: Commit only regenerated generated files and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/shared/catalog.json             apps/shared/native-engine-inventory.json             apps/shared/native-execution-matrix.json             src/data/billing-profile-runtime-extensions.json             audit/discovery/discovery-baseline.json             audit/discovery/discovery-inventory.json             audit/discovery/DISCOVERY-RECONCILIATION-REPORT.md             audit/discovery/SEO-OFFLINE-VALIDATION.md             audit/discovery/tool-knowledge-index.json             audit/discovery/search-eval/native-golden.v1.json
          git rm .github/workflows/regenerate-discovery-artifacts.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m "chore(discovery): reconcile catalogue-derived audit artifacts"
          git push origin "HEAD:${GITHUB_REF_NAME}"
