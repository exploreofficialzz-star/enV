name: SEO canonical-domain validation

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/seo-canonical-domain.yml"
      - "vercel.json"
      - "scripts/seo-domain-policy.mjs"
      - "scripts/check-live-seo.mjs"
      - "scripts/check-seo-artifacts.mjs"
      - "scripts/seo-artifacts.test.mjs"
      - "docs/seo-search-console-setup.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/seo-canonical-domain.yml"
      - "vercel.json"
      - "scripts/seo-domain-policy.mjs"
      - "scripts/check-live-seo.mjs"
      - "scripts/check-seo-artifacts.mjs"
      - "scripts/seo-artifacts.test.mjs"
      - "docs/seo-search-console-setup.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate generated SEO artifacts and canonical host policy
        run: npm run check:seo
