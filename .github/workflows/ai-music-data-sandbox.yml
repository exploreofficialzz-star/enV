name: AI Music Data Sandbox

on:
  push:
    branches: [main]
    paths:
      - "src/components/engines/ai-music-data-sandbox.tsx"
      - "src/components/engines/music-sandbox-editor.tsx"
      - "src/components/engines/music-sandbox.css"
      - "src/lib/engines/music-sandbox*.ts"
      - "src/lib/registry.ts"
      - "src/lib/registry-music-sandbox.test.ts"
      - "src/workers/music-sandbox-audio.ts"
      - "src/workers/music-sandbox-zip.ts"
      - "apps/android/app/src/main/java/com/chastech/env/NativeMusicDataSandbox.kt"
      - "apps/android/app/src/test/java/com/chastech/env/NativeMusicDataSandboxTest.kt"
      - "apps/ios/enV/ToolViews.swift"
      - "apps/ios/enVTests/NativeAudioEngineTests.swift"
      - "docs/ai-music-data-sandbox.md"
      - "scripts/audit-ai-music-data-sandbox-browser.mjs"
      - ".github/workflows/ai-music-data-sandbox.yml"
      - "package*.json"
  pull_request:
    paths:
      - "src/components/engines/ai-music-data-sandbox.tsx"
      - "src/components/engines/music-sandbox-editor.tsx"
      - "src/components/engines/music-sandbox.css"
      - "src/lib/engines/music-sandbox*.ts"
      - "src/lib/registry.ts"
      - "src/lib/registry-music-sandbox.test.ts"
      - "src/workers/music-sandbox-audio.ts"
      - "src/workers/music-sandbox-zip.ts"
      - "apps/android/app/src/main/java/com/chastech/env/NativeMusicDataSandbox.kt"
      - "apps/android/app/src/test/java/com/chastech/env/NativeMusicDataSandboxTest.kt"
      - "apps/ios/enV/ToolViews.swift"
      - "apps/ios/enVTests/NativeAudioEngineTests.swift"
      - "docs/ai-music-data-sandbox.md"
      - "scripts/audit-ai-music-data-sandbox-browser.mjs"
      - ".github/workflows/ai-music-data-sandbox.yml"
      - "package*.json"

permissions:
  contents: read

jobs:
  sandbox:
    name: Local preparation, exports and responsive browser audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:music-data-sandbox
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 8081 > /tmp/music-sandbox-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/music-sandbox-preview.log
          exit 1
      - name: Verify sandbox workflow and accessibility
        env:
          BROWSER_AUDIT_BASE_URL: http://127.0.0.1:8081
        run: npm run audit:music-data-sandbox:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-music-data-sandbox-browser
          path: /tmp/env-music-sandbox-*/*.png
          if-no-files-found: ignore
