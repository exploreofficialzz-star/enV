name: Import Video Link Screen Recording

on:
  push:
    branches:
      - feat/video-link-screen-recording-20261117
    paths:
      - ".task/video-link-recorder/READY"

permissions:
  contents: write

concurrency:
  group: video-link-recorder-import
  cancel-in-progress: false

jobs:
  import-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/video-link-screen-recording-20261117
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Extract supplied tool package and apply integration
        shell: bash
        run: |
          set -euxo pipefail
          test -f .task/video-link-recorder/READY
          test "$(find .task/video-link-recorder -maxdepth 1 -name 'complete.part*' | wc -l)" -eq 19
          cat .task/video-link-recorder/complete.part* > /tmp/video-link-recorder.tar.xz.b64
          test "$(wc -c < /tmp/video-link-recorder.tar.xz.b64 | tr -d ' ')" -eq 51296
          base64 --decode /tmp/video-link-recorder.tar.xz.b64 > /tmp/video-link-recorder.tar.xz
          echo 'f5f787b0551da6d6fd9c74bcc8ad60dfbdc6a6f4eec135bdb639f2278d8c5003  /tmp/video-link-recorder.tar.xz' | sha256sum --check
          tar -tJf /tmp/video-link-recorder.tar.xz > /tmp/video-link-recorder-files.txt
          grep -Fx './_integration/video-link-screen-recording-wiring.patch' /tmp/video-link-recorder-files.txt
          tar -xJf /tmp/video-link-recorder.tar.xz -C .

          # The uploaded patch targets an older native-coverage checker and package.json
          # test chain. Keep all current platform wiring hunks, then update those two
          # integration points against the live repository structure.
          python3 - <<'PY'
          import re
          from pathlib import Path
          patch = Path('_integration/video-link-screen-recording-wiring.patch').read_text()
          sections = re.split(r'(?=^--- a/)', patch, flags=re.MULTILINE)
          skip = ('--- a/package.json', '--- a/scripts/check-native-coverage.mjs')
          filtered = ''.join(section for section in sections if not section.startswith(skip))
          Path('/tmp/video-link-screen-recording-wiring.patch').write_text(filtered)
          PY
          patch --dry-run --verbose -p1 < /tmp/video-link-screen-recording-wiring.patch > /tmp/video-link-patch-dry-run.log 2>&1 || { cat /tmp/video-link-patch-dry-run.log; exit 1; }
          cat /tmp/video-link-patch-dry-run.log
          patch --verbose -p1 < /tmp/video-link-screen-recording-wiring.patch

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'));
          pkg.scripts ??= {};
          pkg.scripts['check:video-link-recorder'] = 'node scripts/check-video-link-recorder.mjs';
          let test = pkg.scripts.test ?? '';
          const check = 'node scripts/check-video-link-recorder.mjs';
          if (!test.includes(check)) {
            const anchor = 'node scripts/check-camera-studio.mjs && ';
            if (!test.includes(anchor)) throw new Error('Cannot find camera-studio test anchor in package.json');
            test = test.replace(anchor, anchor + check + ' && ');
          }
          const mediaTests = 'src/lib/media/music-downloader.test.ts src/lib/media/song-metadata-analyzer.test.ts';
          if (!test.includes('src/lib/media/video-link-recording.test.ts')) {
            if (!test.includes(mediaTests)) throw new Error('Cannot find media test insertion point in package.json');
            test = test.replace(mediaTests, 'src/lib/media/music-downloader.test.ts src/lib/media/video-link-recording.test.ts src/lib/media/song-metadata-analyzer.test.ts');
          }
          pkg.scripts.test = test;
          fs.writeFileSync(file, JSON.stringify(pkg, null, 2) + '\n');
          NODE

          python3 - <<'PY'
          from pathlib import Path
          tool_id = 'video-link-screen-recording'
          for platform in ('android', 'ios'):
              path = Path(f'apps/{platform}/native-tool-coverage.txt')
              data = path.read_text().splitlines()
              if tool_id not in data:
                  data.append(tool_id)
                  path.write_text('\n'.join(data) + '\n')
          PY

      - name: Install locked dependencies
        run: npm ci

      - name: Regenerate native catalog and billing/offline profiles
        run: |
          npm run export:native-catalog
          npm run generate:billing-profiles
          npm run generate:offline-capabilities
          npm run generate:offline-eligibility

      - name: Verify cross-platform tool wiring and recording policy
        run: npm run check:video-link-recorder

      - name: Run complete repository tests
        run: npm test

      - name: Typecheck, lint and production build
        run: |
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit verified integration to feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .task/video-link-recorder _integration
          rm -f .github/workflows/video-link-recorder-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes were produced by the import."
            exit 1
          fi
          git commit -m "Add standalone Video Link Screen Recording tool"
          git push origin HEAD:feat/video-link-screen-recording-20261117
