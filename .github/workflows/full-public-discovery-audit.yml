name: Full public discovery audit

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/full-public-discovery-audit.yml"
      - "scripts/audit-full-public-discovery.mjs"
      - "scripts/full-public-discovery-audit-core.mjs"
      - "scripts/full-public-discovery-audit-core.test.mjs"
      - "scripts/generate-seo-artifacts.mjs"
      - "scripts/evaluate-search-quality.mjs"
      - "scripts/evaluate-phrasing-hypotheses.mjs"
      - "scripts/generate-search-golden.mjs"
      - "scripts/audit-related-tools.mjs"
      - "scripts/related-tools-baseline.mjs"
      - "src/lib/search.ts"
      - "src/lib/search.test.ts"
      - "src/data/search-aliases.ts"
      - "audit/discovery/search-eval/**"
      - "audit/discovery/demand/phrasing-hypotheses.v1.json"
      - "src/lib/seo-metadata.ts"
      - "src/lib/registry.ts"
      - "src/lib/tool-documentation.ts"
      - "src/data/catalog.ts"
      - "src/data/categories.ts"
      - "src/routes/**"
      - "package.json"
  pull_request:
    paths:
      - ".github/workflows/full-public-discovery-audit.yml"
      - "scripts/audit-full-public-discovery.mjs"
      - "scripts/full-public-discovery-audit-core.mjs"
      - "scripts/full-public-discovery-audit-core.test.mjs"
      - "scripts/generate-seo-artifacts.mjs"
      - "scripts/evaluate-search-quality.mjs"
      - "scripts/evaluate-phrasing-hypotheses.mjs"
      - "scripts/generate-search-golden.mjs"
      - "scripts/audit-related-tools.mjs"
      - "scripts/related-tools-baseline.mjs"
      - "src/lib/search.ts"
      - "src/lib/search.test.ts"
      - "src/data/search-aliases.ts"
      - "audit/discovery/search-eval/**"
      - "audit/discovery/demand/phrasing-hypotheses.v1.json"
      - "src/lib/seo-metadata.ts"
      - "src/lib/registry.ts"
      - "src/lib/tool-documentation.ts"
      - "src/data/catalog.ts"
      - "src/data/categories.ts"
      - "src/routes/**"
      - "package.json"

permissions:
  contents: read

concurrency:
  group: full-public-discovery-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    name: Crawl every canonical public discovery route
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh source-derived native and SEO discovery artifacts
        run: |
          npm run export:native-catalog
          npm run generate:billing-profiles
          npm run check:native-discovery
          npm run export:native-execution-matrix
          npm run generate:seo
          npm run discovery:inventory
          npm run discovery:knowledge-index
          npm run discovery:seo-offline

      - name: Run discovery, guide and SEO regression tests
        run: npm run test:discovery

      - name: Run discovery relevance, phrasing and cross-link gates
        run: npm run discovery:check

      # TanStack Start generates the ignored routeTree.gen.ts when Vite starts.
      # Generate that source before tsc so file-route types are available in CI.
      - name: Start local SSR server and generate route types
        shell: bash
        run: |
          set -euo pipefail
          npm run dev > /tmp/env-full-discovery-audit.log 2>&1 &
          echo $! > /tmp/env-full-discovery-audit.pid
          for attempt in {1..120}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              echo "Local SSR server and generated route tree are ready."
              exit 0
            fi
            sleep 1
          done
          cat /tmp/env-full-discovery-audit.log
          exit 1

      - name: Crawl all canonical tool, guide, category and article routes
        env:
          SEO_AUDIT_BASE_URL: http://127.0.0.1:8080
          DISCOVERY_AUDIT_CONCURRENCY: "8"
          DISCOVERY_AUDIT_REQUEST_TIMEOUT_MS: "20000"
        run: npm run audit:discovery:full -- --report=artifacts/full-discovery-audit/report.json

      # Keep strict app typechecking, but run it after the independent rendered-route
      # audit so a compile error in an unrelated Studio does not suppress route evidence.
      - name: Typecheck the application
        run: npm run typecheck

      - name: Upload full discovery audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-public-discovery-audit
          path: |
            artifacts/full-discovery-audit/report.json
            audit/discovery/SEO-OFFLINE-VALIDATION.md
            audit/discovery/discovery-inventory.json
            audit/discovery/DISCOVERY-RECONCILIATION-REPORT.md
            audit/discovery/tool-knowledge-index.json
          if-no-files-found: warn
          retention-days: 30

      - name: Show local SSR diagnostics on failure
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/env-full-discovery-audit.log ]; then
            cat /tmp/env-full-discovery-audit.log
          else
            echo "The failure occurred before the local SSR server was started; no SSR log exists."
          fi
