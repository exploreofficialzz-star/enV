name: Audiomack Hallelujah live acceptance test

on:
  push:
    branches: [main]
    paths:
      - "scripts/media/audiomack-hallelujah-smoke.mjs"
      - "scripts/media/vendor/audiomack.py"
      - "scripts/media/audiomack-live-diagnostics.py"
      - "scripts/media/audiomack-vendor-regression.py"
      - "processor/Dockerfile"
      - ".github/workflows/audiomack-hallelujah-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-song-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Ensure FFprobe for real audio validation
        run: |
          set -e
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update -qq
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y -qq ffmpeg
          fi
          ffprobe -version | head -n 1
      - name: Inspect creator-approved Audiomack source resolver safely
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/env-audiomack-debug"
          "$RUNNER_TEMP/env-audiomack-debug/bin/pip" install --quiet 'yt-dlp==2026.10.21'
          EXTRACTOR="$("$RUNNER_TEMP/env-audiomack-debug/bin/python" -c 'import yt_dlp.extractor.audiomack as m; print(m.__file__)')"
          cp scripts/media/vendor/audiomack.py "$EXTRACTOR"
          "$RUNNER_TEMP/env-audiomack-debug/bin/python" scripts/media/audiomack-live-diagnostics.py
      - name: Verify the bundled Audiomack extractor on an authorized real song
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/env-audiomack"
          "$RUNNER_TEMP/env-audiomack/bin/pip" install --quiet 'yt-dlp==2026.10.21'
          EXTRACTOR="$("$RUNNER_TEMP/env-audiomack/bin/python" -c 'import yt_dlp.extractor.audiomack as m; print(m.__file__)')"
          cp scripts/media/vendor/audiomack.py "$EXTRACTOR"
          "$RUNNER_TEMP/env-audiomack/bin/python" -m py_compile "$EXTRACTOR"
          "$RUNNER_TEMP/env-audiomack/bin/python" scripts/media/audiomack-vendor-regression.py
          mkdir -p "$RUNNER_TEMP/env-audiomack-audio"
          "$RUNNER_TEMP/env-audiomack/bin/yt-dlp" \
            --ignore-config --no-playlist --no-warnings --quiet \
            --socket-timeout 25 --retries 2 --fragment-retries 2 \
            --max-filesize 20M --format bestaudio/best \
            --extract-audio --audio-format mp3 \
            --output "$RUNNER_TEMP/env-audiomack-audio/track.%(ext)s" \
            'https://audiomack.com/chas-d/song/hallelujah?share-user-id=118614535'
          AUDIO="$RUNNER_TEMP/env-audiomack-audio/track.mp3"
          test -s "$AUDIO"
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=nokey=1:noprint_wrappers=1 "$AUDIO")"
          awk -v duration="$DURATION" 'BEGIN { exit !(duration > 30) }'
          echo "Vendored extractor audio acceptance passed (playable MP3)."
      - name: Inspect public song and validate actual downloadable audio
        env:
          MUSIC_ACCEPTANCE_API: https://env-q3mq.onrender.com/api/backend/url-media
          MUSIC_ACCEPTANCE_SONG: https://audiomack.com/chas-d/song/hallelujah?share-user-id=118614535
        run: |
          set -euo pipefail
          # Deployment and CI start simultaneously. Retry only this isolated
          # acceptance check as Render changes its container image.
          for n in 1 2 3 4 5; do
            if node scripts/media/audiomack-hallelujah-smoke.mjs; then
              exit 0
            fi
            if test "$n" -eq 5; then
              exit 1
            fi
            sleep 35
          done
