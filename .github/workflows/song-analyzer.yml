name: Song Analyzer
on:
  push:
    branches: [main]
    paths:
      [
        "local-song-analyzer/**",
        "src/lib/media/**",
        "src/lib/engines/music-dataset-analysis.ts",
        "src/lib/engines/audio-studio.ts",
        "src/workers/song-*.ts",
        "processor/server.mjs",
        "scripts/processor-gateway.test.mjs",
        "scripts/audit-song-analyzer-browser.mjs",
        "src/components/engines/song-*.tsx",
        ".github/workflows/song-analyzer.yml",
        "package*.json",
      ]
  pull_request:
    paths:
      [
        "local-song-analyzer/**",
        "src/lib/media/**",
        "src/lib/engines/music-dataset-analysis.ts",
        "src/lib/engines/audio-studio.ts",
        "src/workers/song-*.ts",
        "processor/server.mjs",
        "scripts/processor-gateway.test.mjs",
        "scripts/audit-song-analyzer-browser.mjs",
        "src/components/engines/song-*.tsx",
        ".github/workflows/song-analyzer.yml",
        "package*.json",
      ]
permissions:
  contents: read
jobs:
  local-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e './local-song-analyzer[test]'
      - run: pytest -q local-song-analyzer
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:song-analyzer
      - run: node --test scripts/processor-gateway.test.mjs
      - name: Install browser
        run: |
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$(node --input-type=module -e 'import { chromium } from "playwright"; process.stdout.write(chromium.executablePath())')" >> "$GITHUB_ENV"
      - run: npm run build
      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 8081 > /tmp/song-preview.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/song-preview.log
          exit 1
      - name: Verify browser workflow and accessibility
        env:
          BROWSER_AUDIT_BASE_URL: http://127.0.0.1:8081
        run: npm run audit:song-analyzer:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: song-analyzer-browser
          path: /tmp/env-song-browser-*/*.png
          if-no-files-found: ignore
