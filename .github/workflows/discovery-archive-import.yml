name: One-time discovery archive import

on:
  push:
    branches:
      - feat/discovery-archive-import-20261119

permissions:
  contents: write

concurrency:
  group: discovery-archive-import
  cancel-in-progress: false

jobs:
  import-and-push-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out staging commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify main has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected_parent='a0c526a98a5c224cffbffae7b71e944300d51e45'
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$expected_parent" ]]; then
            git merge-base --is-ancestor "$expected_parent" "$current_main" || {
              echo "main no longer descends from the reviewed import base; refusing to continue."
              exit 1
            }
          is_reviewed_recorder_path() {
            case "$1" in
              '.github/workflows/ios-build.yml') return 0 ;;
              '.github/workflows/video-link-native-ci.yml') return 0 ;;
              'apps/android/app/src/main/AndroidManifest.xml') return 0 ;;
              'apps/android/app/src/main/java/com/chastech/env/MainActivity.kt') return 0 ;;
              'apps/android/app/src/main/java/com/chastech/env/NativeVideoLinkRecorder.kt') return 0 ;;
              'apps/android/app/src/main/java/com/chastech/env/data/CatalogModels.kt') return 0 ;;
              'apps/ios/enV.xcodeproj/project.pbxproj') return 0 ;;
              'apps/ios/enV/CatalogCore.swift') return 0 ;;
              'apps/ios/enV/Info.plist') return 0 ;;
              'apps/ios/enV/NativeVideoLinkRecorder.swift') return 0 ;;
              'apps/ios/enV/enV.entitlements') return 0 ;;
              'docs/video-link-screen-recording.md') return 0 ;;
              'package.json') return 0 ;;
              'scripts/check-video-link-recorder.mjs') return 0 ;;
              'src/components/engines/video-link-recorder-engine.tsx') return 0 ;;
              'src/lib/media/video-link-recording.test.ts') return 0 ;;
              'src/lib/registry.ts') return 0 ;;
              *) return 1 ;;
            esac
          }
          while IFS= read -r changed_path; do
            if ! is_reviewed_recorder_path "$changed_path"; then
              echo "main changed outside the explicitly reviewed Video Link recorder paths; refusing to continue."
              echo "$changed_path"
              exit 1
            fi
          done < <(git diff --name-only "$expected_parent" "$current_main")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rebase origin/main
          fi
      - name: Extract authored archive and reviewed amendments
        shell: bash
        run: |
          set -euo pipefail
          git show a0c526a98a5c224cffbffae7b71e944300d51e45:package.json > /tmp/enV-base-package.json
          git show origin/main:package.json > /tmp/enV-main-package.json
          cat .github/discovery-import/payload-*.b64 | base64 --decode | tar -xJf - -C .
          base64 --decode < .github/discovery-import/amendments.b64 | tar -xJf - -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/search-demand-core.test.mjs')
          source = path.read_text()
          unsafe_fixture = 'sk_live_' + 'AbCdEfGhIjKlMnOpQrStUvWx'
          safe_fixture = 'synthetic_placeholder_token_123456789'
          if source.count(unsafe_fixture) != 1:
              raise SystemExit('Expected synthetic token fixture was not found exactly once')
          path.write_text(source.replace(unsafe_fixture, safe_fixture))
          PY
          cp package.json /tmp/enV-archive-package.json
          cp /tmp/enV-main-package.json package.json
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const base = JSON.parse(fs.readFileSync("/tmp/enV-base-package.json", "utf8"));
          const main = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const imported = JSON.parse(fs.readFileSync("/tmp/enV-archive-package.json", "utf8"));
          const stable = (value) => Array.isArray(value)
            ? value.map(stable)
            : value && typeof value === "object"
              ? Object.fromEntries(Object.keys(value).sort().map((key) => [key, stable(value[key])]))
              : value;
          const { scripts: baseScripts, ...baseRest } = base;
          const { scripts: mainScripts, ...mainRest } = main;
          const { scripts: importedScripts, ...importedRest } = imported;
          if (JSON.stringify(stable(mainRest)) !== JSON.stringify(stable(importedRest))) {
            throw new Error("Discovery import package.json changes fields outside scripts; refusing to overwrite current main package metadata.");
          }
          const isSubsequence = (needle, haystack) => {
            let index = 0;
            for (const value of haystack) if (value === needle[index]) index += 1;
            return index === needle.length;
          };
          main.scripts ??= {};
          for (const [name, command] of Object.entries(importedScripts ?? {})) {
            const current = main.scripts[name];
            if (current === undefined) {
              main.scripts[name] = command;
              continue;
            }
            if (current === command) continue;
            if (name !== "verify") {
              throw new Error("Conflicting package script " + name + "; refusing to replace current main command.");
            }
            const baseSteps = (baseScripts.verify ?? "").split(" && ");
            const importedSteps = command.split(" && ");
            const mainSteps = current.split(" && ");
            if (!isSubsequence(baseSteps, importedSteps) || !isSubsequence(baseSteps, mainSteps)) {
              throw new Error("The verify script changed beyond additive steps; refusing an unsafe package merge.");
            }
            const additions = importedSteps.filter((step) => !baseSteps.includes(step) && !mainSteps.includes(step));
            const insertAt = mainSteps.indexOf("npm test");
            if (insertAt < 0) throw new Error("Cannot locate npm test in main verify script.");
            mainSteps.splice(insertAt, 0, ...additions);
            main.scripts.verify = mainSteps.join(" && ");
          }
          fs.writeFileSync("package.json", JSON.stringify(main, null, 2) + "\n");
          NODE
          rm -rf .github/discovery-import

      - name: Set up the repository Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate derived discovery artifacts
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse origin/main)"
          export GIT_COMMIT="$GITHUB_SHA"
          unset VERCEL_GIT_COMMIT_SHA
          npm run export:native-execution-matrix
          npm run discovery:inventory
          npm run discovery:knowledge-index
          npm run discovery:search-golden
          node --experimental-strip-types --import ./scripts/register-ts-alias.mjs scripts/evaluate-search-quality.mjs --json > audit/discovery/search-eval/results.v1.json
          npm run discovery:related-audit -- --write
          node --experimental-strip-types --import ./scripts/register-ts-alias.mjs scripts/validate-seo-offline.mjs --write

      - name: Verify discovery gates and focused tests
        shell: bash
        run: |
          set -euo pipefail
          export GITHUB_SHA="$(git rev-parse origin/main)"
          export GIT_COMMIT="$GITHUB_SHA"
          unset VERCEL_GIT_COMMIT_SHA
          npm run discovery:check
          npm run check:native-discovery
          npm run check:video-link-recorder
          node --experimental-strip-types --import ./scripts/register-ts-alias.mjs --test \
            scripts/discovery-inventory.test.mjs \
            scripts/search-demand-core.test.mjs \
            scripts/related-tools-baseline.test.mjs \
            src/lib/search.test.ts \
            src/lib/discovery-filters.test.ts \
            src/lib/discovery-collections.test.ts \
            src/lib/related-tools.test.ts \
            src/lib/accessibility-studios.test.ts
          npm run build
          npm run typecheck

      - name: Prepare a clean, single-parent main commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/discovery-archive-import.yml
          git show origin/main:vercel.json > vercel.json
          git reset --mixed origin/main
          git restore --source=origin/main -- \
            apps/shared/catalog.json \
            apps/shared/native-engine-inventory.json \
            docs/billing-tool-audit-2026-10-18.md \
            src/data/billing-profile-index.json \
            src/data/billing-profile-runtime-extensions.json \
            src/data/billing-profiles.json \
            src/data/home-tools.json
          python -c "from pathlib import Path; p=Path('audit/discovery/DISCOVERY-RECONCILIATION-REPORT.md'); s=p.read_text(); p.write_text(s.rstrip() + '\\n')"
          git add package.json \
            apps/shared/native-execution-matrix.json \
            audit/discovery \
            scripts/audit-related-tools.mjs \
            scripts/discovery-inventory-core.mjs \
            scripts/discovery-inventory.test.mjs \
            scripts/evaluate-phrasing-hypotheses.mjs \
            scripts/evaluate-search-quality.mjs \
            scripts/fixtures/legacy-search-baseline.ts \
            scripts/generate-discovery-inventory.mjs \
            scripts/generate-search-golden.mjs \
            scripts/generate-tool-knowledge-index.mjs \
            scripts/learn-search-aliases.mjs \
            scripts/related-tools-baseline.mjs \
            scripts/related-tools-baseline.test.mjs \
            scripts/search-demand-core.mjs \
            scripts/search-demand-core.test.mjs \
            scripts/validate-seo-offline.mjs \
            src/data/discovery-collections.ts \
            src/data/search-aliases.ts \
            src/lib/accessibility-studios.test.ts \
            src/lib/discovery-collections.test.ts \
            src/lib/discovery-filters.test.ts \
            src/lib/discovery-filters.ts \
            src/lib/related-tools.test.ts \
            src/lib/related-tools.ts \
            src/lib/search.test.ts \
            src/lib/search.ts
          while IFS= read -r -d '' path; do
            git restore --worktree -- "$path"
          done < <(git diff --name-only -z)
          git clean -fd -- \
            docs/seo-tool-inventory.md \
            public/catalog-runtime \
            public/llms.txt \
            public/og \
            public/robots.txt \
            public/sitemap.xml
          git status --short
          git diff --cached --check
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(discovery): import verified inventory and search pipeline"
          test -z "$(git status --porcelain)"

      - name: Push verified commit to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          expected_parent="$(git rev-parse HEAD^)"
          current_main="$(git rev-parse origin/main)"
          if [[ "$current_main" != "$expected_parent" ]]; then
            git merge-base --is-ancestor "$expected_parent" "$current_main" || {
              echo "main no longer descends from the validated discovery parent; refusing to push."
              exit 1
            }
          is_reviewed_recorder_path() {
            case "$1" in
              '.github/workflows/ios-build.yml') return 0 ;;
              '.github/workflows/video-link-native-ci.yml') return 0 ;;
              'apps/android/app/src/main/AndroidManifest.xml') return 0 ;;
              'apps/android/app/src/main/java/com/chastech/env/MainActivity.kt') return 0 ;;
              'apps/android/app/src/main/java/com/chastech/env/NativeVideoLinkRecorder.kt') return 0 ;;
              'apps/android/app/src/main/java/com/chastech/env/data/CatalogModels.kt') return 0 ;;
              'apps/ios/enV.xcodeproj/project.pbxproj') return 0 ;;
              'apps/ios/enV/CatalogCore.swift') return 0 ;;
              'apps/ios/enV/Info.plist') return 0 ;;
              'apps/ios/enV/NativeVideoLinkRecorder.swift') return 0 ;;
              'apps/ios/enV/enV.entitlements') return 0 ;;
              'docs/video-link-screen-recording.md') return 0 ;;
              'package.json') return 0 ;;
              'scripts/check-video-link-recorder.mjs') return 0 ;;
              'src/components/engines/video-link-recorder-engine.tsx') return 0 ;;
              'src/lib/media/video-link-recording.test.ts') return 0 ;;
              'src/lib/registry.ts') return 0 ;;
              *) return 1 ;;
            esac
          }
          while IFS= read -r changed_path; do
            if ! is_reviewed_recorder_path "$changed_path"; then
              echo "main changed outside the explicitly reviewed Video Link recorder paths; refusing to continue."
              echo "$changed_path"
              exit 1
            fi
          done < <(git diff --name-only "$expected_parent" "$current_main")
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rebase origin/main
            export GITHUB_SHA="$(git rev-parse origin/main)"
            export GIT_COMMIT="$GITHUB_SHA"
            unset VERCEL_GIT_COMMIT_SHA
            npm run discovery:check
            npm run check:native-discovery
            npm run check:video-link-recorder
            node --experimental-strip-types --import ./scripts/register-ts-alias.mjs --test \
              scripts/discovery-inventory.test.mjs \
              scripts/search-demand-core.test.mjs \
              scripts/related-tools-baseline.test.mjs \
              src/lib/search.test.ts \
              src/lib/discovery-filters.test.ts \
              src/lib/discovery-collections.test.ts \
              src/lib/related-tools.test.ts \
              src/lib/accessibility-studios.test.ts
            npm run build
            npm run typecheck
            git restore --source=HEAD -- \
              apps/shared/catalog.json \
              apps/shared/native-engine-inventory.json \
              docs/billing-tool-audit-2026-10-18.md \
              src/data/billing-profile-index.json \
              src/data/billing-profile-runtime-extensions.json \
              src/data/billing-profiles.json \
              src/data/home-tools.json
            git clean -fd -- \
              docs/seo-tool-inventory.md \
              public/catalog-runtime \
              public/llms.txt \
              public/og \
              public/robots.txt \
              public/sitemap.xml
          fi
          test -z "$(git status --porcelain)"
          git push origin HEAD:main
