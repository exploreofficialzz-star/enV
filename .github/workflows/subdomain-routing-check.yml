name: Subdomain routing verification

on:
  pull_request:
    paths:
      - "src/router.tsx"
      - "src/lib/subdomain-routing.ts"
      - "scripts/check-subdomain-routing.mjs"
      - "vercel.json"
      - ".github/workflows/subdomain-routing-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: subdomain-routing-check
  cancel-in-progress: true

jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify all host-to-route mappings
        run: node --experimental-strip-types scripts/check-subdomain-routing.mjs
      - name: Build the production application
        run: npm run build
