name: Android game runtime verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        renderer: [compatibility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Select experimental renderer
        env:
          ENV_GAME_RENDERER: ${{ matrix.renderer }}
        run: |
          if [ "$ENV_GAME_RENDERER" = mobile ]; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/android/app/src/main/java/com/chastech/env/NativeGameRuntimeActivity.java")
          source = path.read_text()
          old = 'args.addAll(Arrays.asList("--main-pack"'
          new = 'args.addAll(Arrays.asList("--rendering-method", "mobile", "--main-pack"'
          if source.count(old) != 1:
              raise SystemExit("Native runtime command line was not found")
          path.write_text(source.replace(old, new))
          PY
          fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Start virtual display for host graphics
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > "$RUNNER_TEMP/env-xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
      - name: Run native game playback test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -memory 3072 -cores 2
          script: bash scripts/test-android-game-preview.sh
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-game-preview-${{ matrix.renderer }}
          path: |
            apps/android/app/build/outputs/androidTest-results/connected/debug/
            apps/android/app/build/reports/androidTests/connected/debug/
            android-game-evidence/
          if-no-files-found: ignore
