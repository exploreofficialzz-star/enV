name: Audiomack Hallelujah live acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audiomack-live-acceptance.yml"
      - "scripts/audiomack-live-smoke.mjs"
permissions:
  contents: read
jobs:
  end-to-end-audiomack:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Check deployed single-track preview AND playable file bytes
        run: node scripts/audiomack-live-smoke.mjs
