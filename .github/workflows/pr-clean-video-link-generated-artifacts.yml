name: Clean generated build artifacts from Video Link PR

on:
  push:
    branches:
      - feat/video-link-screen-recording-20261117
    paths:
      - ".task/video-link-pr-cleanup/READY"

permissions:
  contents: write

concurrency:
  group: video-link-pr-generated-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/video-link-screen-recording-20261117
          fetch-depth: 0
          persist-credentials: true

      - name: Restore build-generated outputs and remove patch backups
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          reset_to_main_or_remove() {
            local path="$1"
            if git ls-tree -r --name-only origin/main -- "$path" | grep -q .; then
              git restore --source=origin/main --staged --worktree -- "$path"
            else
              git rm -r -f --ignore-unmatch -- "$path" >/dev/null 2>&1 || true
              rm -rf -- "$path"
            fi
          }

          # These are recreated by enV's existing prebuild pipeline; keeping the
          # generated output in the feature PR would add unrelated repository-wide churn.
          reset_to_main_or_remove "public/og/cards"
          reset_to_main_or_remove "public/catalog-runtime"
          reset_to_main_or_remove "public/llms.txt"
          reset_to_main_or_remove "public/robots.txt"
          reset_to_main_or_remove "public/sitemap.xml"
          reset_to_main_or_remove "docs/seo-tool-inventory.md"
          reset_to_main_or_remove "src/data/home-tools.json"
          reset_to_main_or_remove "apps/shared/catalog.json"
          reset_to_main_or_remove "apps/shared/native-engine-inventory.json"
          reset_to_main_or_remove "apps/shared/native-execution-matrix.json"

          # GNU patch created these .orig backup files while applying the supplied
          # integration diff. They are not source files and must not enter the PR.
          git rm -f --ignore-unmatch --             apps/android/app/src/main/java/com/chastech/env/MainActivity.kt.orig             scripts/export-native-catalog.mjs.orig             src/lib/registry.ts.orig             src/lib/tool-documentation.test.ts.orig

          rm -rf .task/video-link-pr-cleanup
          rm -f .github/workflows/pr-clean-video-link-generated-artifacts.yml
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: exclude build-generated artifacts from recorder PR"
          git push origin HEAD:feat/video-link-screen-recording-20261117
