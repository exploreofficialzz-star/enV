name: Developer Studios quality gates

on:
  push:
    branches: [main]
    paths:
      - "src/lib/engines/**"
      - "src/components/engines/developer-engine.tsx"
      - "src/components/engines/io-engines.tsx"
      - "tests/fixtures/developer-studio-golden.json"
      - "apps/android/app/src/main/java/com/chastech/env/engine/**"
      - "apps/android/app/src/test/java/com/chastech/env/engine/**"
      - "apps/ios/enV/NativeTextEngine.swift"
      - "apps/ios/enVTests/NativeTextEngineTests.swift"
      - "scripts/*developer*"
      - "scripts/sync-developer-golden-fixtures.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/developer-studios-quality.yml"
  pull_request:
    paths:
      - "src/lib/engines/**"
      - "src/components/engines/developer-engine.tsx"
      - "src/components/engines/io-engines.tsx"
      - "tests/fixtures/developer-studio-golden.json"
      - "apps/android/app/src/main/java/com/chastech/env/engine/**"
      - "apps/android/app/src/test/java/com/chastech/env/engine/**"
      - "apps/ios/enV/NativeTextEngine.swift"
      - "apps/ios/enVTests/NativeTextEngineTests.swift"
      - "scripts/*developer*"
      - "scripts/sync-developer-golden-fixtures.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/developer-studios-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-studios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-studios:
    name: Web parsers, golden tests, privacy and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify shared cross-platform golden fixtures
        run: npm run check:developer:fixtures
      - name: Verify catalog, route and static privacy contracts
        run: |
          npm run check:developer
          npm run check:developer:privacy
          npm run check:developer-routes
          npm run check:execution-policy
      - name: Run focused Developer Studio regression suite
        run: >-
          node --experimental-strip-types --import ./scripts/register-ts-alias.mjs --test
          src/lib/engines/developer-studios.test.ts
          src/lib/engines/precise-formatters.test.ts
          src/lib/engines/regex-studio.test.ts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Start app and run payload privacy, output correctness, mobile and axe audit
        run: npm run audit:developer:browser:ci
      - name: Run reproducible local formatter baseline
        run: npm run benchmark:developer -- --report=audit/developer-tool-benchmark.json
      - name: Upload privacy/accessibility and benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: developer-studios-quality-${{ github.sha }}
          path: |
            audit/developer-studio-browser-audit.json
            audit/developer-tool-benchmark.json
          if-no-files-found: warn
          retention-days: 30
