name: Developer Studios quality gates

on:
  push:
    branches: [main]
    paths:
      - "src/lib/engines/**"
      - "src/lib/developer-studios-catalog*"
      - "src/components/engines/developer-studio-engine.tsx"
      - "src/components/engines/ux-ui-studio-engine.tsx"
      - "src/components/tools/tool-engine.tsx"
      - "src/components/engines/developer-recipe-workbench.tsx"
      - "src/components/engines/tool-engine.tsx"
      - "src/lib/registry.ts"
      - "src/routes/tools/$category/index.tsx"
      - "src/routes/tools/$category/$slug.tsx"
      - "apps/android/app/src/main/java/com/chastech/env/data/DeveloperStudios.kt"
      - "apps/android/app/src/main/java/com/chastech/env/data/CatalogModels.kt"
      - "apps/android/app/src/main/java/com/chastech/env/MainActivity.kt"
      - "apps/android/app/src/main/java/com/chastech/env/NativeUxUiStudio.kt"
      - "apps/android/app/src/test/java/com/chastech/env/data/CatalogModelsTest.kt"
      - "apps/ios/enV/CatalogCore.swift"
      - "apps/ios/enV/ToolViews.swift"
      - "apps/ios/enV/NativeDeveloperRecipe.swift"
      - "apps/ios/enVTests/CatalogCoreTests.swift"
      - "apps/ios/enVTests/NativeDeveloperStudioTests.swift"
      - "apps/ios/enVTests/DeveloperStudioGoldenFixtures.swift"
      - "src/components/engines/developer-engine.tsx"
      - "src/components/engines/io-engines.tsx"
      - "tests/fixtures/developer-studio-golden.json"
      - "apps/android/app/src/main/java/com/chastech/env/engine/**"
      - "apps/android/app/src/test/java/com/chastech/env/engine/**"
      - "apps/ios/enV/NativeTextEngine.swift"
      - "apps/ios/enVTests/NativeTextEngineTests.swift"
      - "scripts/*developer*"
      - "scripts/sync-developer-golden-fixtures.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/developer-studios-quality.yml"
  pull_request:
    paths:
      - "src/lib/engines/**"
      - "src/lib/developer-studios-catalog*"
      - "src/components/engines/developer-studio-engine.tsx"
      - "src/components/engines/ux-ui-studio-engine.tsx"
      - "src/components/tools/tool-engine.tsx"
      - "src/components/engines/developer-recipe-workbench.tsx"
      - "src/components/engines/tool-engine.tsx"
      - "src/lib/registry.ts"
      - "src/routes/tools/$category/index.tsx"
      - "src/routes/tools/$category/$slug.tsx"
      - "apps/android/app/src/main/java/com/chastech/env/data/DeveloperStudios.kt"
      - "apps/android/app/src/main/java/com/chastech/env/data/CatalogModels.kt"
      - "apps/android/app/src/main/java/com/chastech/env/MainActivity.kt"
      - "apps/android/app/src/main/java/com/chastech/env/NativeUxUiStudio.kt"
      - "apps/android/app/src/test/java/com/chastech/env/data/CatalogModelsTest.kt"
      - "apps/ios/enV/CatalogCore.swift"
      - "apps/ios/enV/ToolViews.swift"
      - "apps/ios/enV/NativeDeveloperRecipe.swift"
      - "apps/ios/enVTests/CatalogCoreTests.swift"
      - "apps/ios/enVTests/NativeDeveloperStudioTests.swift"
      - "apps/ios/enVTests/DeveloperStudioGoldenFixtures.swift"
      - "src/components/engines/developer-engine.tsx"
      - "src/components/engines/io-engines.tsx"
      - "tests/fixtures/developer-studio-golden.json"
      - "apps/android/app/src/main/java/com/chastech/env/engine/**"
      - "apps/android/app/src/test/java/com/chastech/env/engine/**"
      - "apps/ios/enV/NativeTextEngine.swift"
      - "apps/ios/enVTests/NativeTextEngineTests.swift"
      - "scripts/*developer*"
      - "scripts/sync-developer-golden-fixtures.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/developer-studios-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-studios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-studios:
    name: Web parsers, golden tests, privacy and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install exact locked dependencies
        run: npm ci
      - name: Verify cross-platform recipe operation parity
        run: npm run check:developer:recipe-parity
      - name: Verify shared cross-platform golden fixtures
        run: npm run check:developer:fixtures
      - name: Verify catalog, route and static privacy contracts
        run: |
          npm run check:developer
          npm run check:developer:privacy
          npm run check:developer-routes
          npm run check:execution-policy
      - name: Run focused Developer Studio regression suite
        run: >-
          node --experimental-strip-types --import ./scripts/register-ts-alias.mjs --test
          src/lib/developer-studios-catalog.test.ts
          src/lib/engines/developer-studios.test.ts
          src/lib/engines/precise-formatters.test.ts
          src/lib/engines/regex-studio.test.ts
      - name: Configure Chromium for Playwright
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$browser_path" ]; then
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
            echo "Using runner-installed Chromium-compatible browser: $browser_path"
          else
            echo "No system Chrome found; installing the Playwright-managed Chromium build."
            npx playwright install --with-deps chromium
          fi
      - name: Start app and run payload privacy, output correctness, mobile and axe audit
        run: npm run audit:developer:browser:ci
      - name: Run reproducible local formatter baseline
        run: npm run benchmark:developer -- --report=audit/developer-tool-benchmark.json
      - name: Upload privacy/accessibility and benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: developer-studios-quality-${{ github.sha }}
          path: |
            audit/developer-studio-browser-audit.json
            audit/developer-tool-benchmark.json
          if-no-files-found: warn
          retention-days: 30
