name: Production live connectivity smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-live-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: production-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public production services
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check production homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-home.html \
            --write-out 'Homepage HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://envtools.store/
          test -s /tmp/env-home.html

      - name: Check Render API readiness and processor health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            --output /tmp/env-render-health.json \
            --write-out 'Render health HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://env-q3mq.onrender.com/health
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/env-render-health.json', 'utf8'));
          const failures = [];
          if (health.ok !== true || health.ready !== true) failures.push('Render API does not report ready=true.');
          if (health.applicationApiOrigin !== 'https://envtools.store') failures.push('Render API is not pointing at the canonical application origin.');
          if (health.authentication !== true) failures.push('Processor shared-secret authentication is not enabled.');
          for (const required of ['media', 'url-media']) {
            if (health.processors?.[required] !== true) failures.push(`Required processor "${required}" is not ready.`);
          }
          if (failures.length) {
            for (const failure of failures) console.error(`FAIL: ${failure}`);
            process.exit(1);
          }
          console.log(`Render API ready; processors: ${Object.entries(health.processors).map(([name, ready]) => `${name}=${ready}`).join(', ')}`);
          NODE

      - name: Check application backend gateway readiness
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-backend-health.json \
            --write-out 'Backend gateway HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://envtools.store/api/backend/health
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/env-backend-health.json', 'utf8'));
          const failures = [];
          if (health.ok !== true || health.ready !== true) failures.push('Application backend gateway does not report ready=true.');
          if (health.processors?.media !== true) failures.push('Application backend media processor is not configured.');
          if (health.processors?.urlMedia !== true) failures.push('Application backend URL-media processor is not configured.');
          if (failures.length) {
            for (const failure of failures) console.error(`FAIL: ${failure}`);
            process.exit(1);
          }
          console.log('Application backend gateway and required processors report ready.');
          NODE

      - name: Check AI status endpoint contract
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-ai-status.json \
            --write-out 'AI status HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://envtools.store/api/ai/status
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync('/tmp/env-ai-status.json', 'utf8'));
          if (status.ok !== true || !status.tasks || typeof status.tasks !== 'object') {
            console.error('FAIL: AI status endpoint is not returning its documented health contract.');
            process.exit(1);
          }
          console.log(`AI status endpoint healthy; enabled=${status.enabled === true}.`);
          NODE
