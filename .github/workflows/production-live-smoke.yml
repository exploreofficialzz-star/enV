name: Production live connectivity smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-live-smoke.yml"
      - "scripts/check-live-seo.mjs"
      - "scripts/generate-seo-artifacts.mjs"
      - "scripts/check-seo-artifacts.mjs"
      - "scripts/check-seo-rendered-routes.mjs"
      - "src/lib/seo-metadata.ts"
      - "src/routes/__root.tsx"
      - "src/routes/index.tsx"
      - "src/routes/tools/**"
      - "src/routes/blog.$slug.tsx"
      - "src/routes/blog.index.tsx"
      - "src/data/catalog.ts"
      - "src/data/categories.ts"
      - "public/robots.txt"
      - "public/sitemap.xml"
      - "public/llms.txt"
      - "vercel.json"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read

concurrency:
  group: production-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify public production services
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check production homepage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-home.html \
            --write-out 'Homepage HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://envtools.store/
          test -s /tmp/env-home.html

      - name: Check public production search discovery and rendered metadata
        if: always()
        run: node scripts/check-live-seo.mjs

      - name: Check Render API readiness and processor health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 4 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 45 \
            --output /tmp/env-render-health.json \
            --write-out 'Render health HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://env-q3mq.onrender.com/health
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/env-render-health.json', 'utf8'));
          const failures = [];
          if (health.ok !== true || health.ready !== true) failures.push('Render API does not report ready=true.');
          if (health.applicationApiOrigin !== 'https://envtools.store') failures.push('Render API is not pointing at the canonical application origin.');
          if (health.authentication !== true) failures.push('Processor shared-secret authentication is not enabled.');
          for (const required of ['media', 'url-media']) {
            if (health.processors?.[required] !== true) failures.push(`Required processor "${required}" is not ready.`);
          }
          if (failures.length) {
            for (const failure of failures) console.error(`FAIL: ${failure}`);
            process.exit(1);
          }
          console.log(`Render API ready; processors: ${Object.entries(health.processors).map(([name, ready]) => `${name}=${ready}`).join(', ')}`);
          NODE

      - name: Check application backend gateway readiness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-backend-health.json \
            --write-out 'Backend gateway HTTP %{http_code}; downloaded %{size_download} bytes\n' \
            https://envtools.store/api/backend/health
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const health = JSON.parse(fs.readFileSync('/tmp/env-backend-health.json', 'utf8'));
          const failures = [];
          if (health.ok !== true || health.ready !== true) failures.push('Application backend gateway does not report ready=true.');
          if (health.processors?.media !== true) failures.push('Application backend media processor is not configured.');
          if (health.processors?.urlMedia !== true) failures.push('Application backend URL-media processor is not configured.');
          if (failures.length) {
            for (const failure of failures) console.error(`FAIL: ${failure}`);
            process.exit(1);
          }
          console.log('Application backend gateway and required processors report ready.');
          NODE

      - name: Check payment funding-options public contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-funding-options.json \
            --write-out 'Payment funding-options HTTP %{http_code}; downloaded %{size_download} bytes\\n' \
            https://envtools.store/api/billing/funding-options
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const response = JSON.parse(fs.readFileSync('/tmp/env-funding-options.json', 'utf8'));
          const data = response?.data;
          const failures = [];
          if (response?.ok !== true || !data || typeof data !== 'object') {
            failures.push('Funding-options response must contain the public data object.');
          }
          if (data && (data.countryCode !== null && typeof data.countryCode !== 'string')) {
            failures.push('Funding-options countryCode must be a string or null.');
          }
          if (data && (data.currency !== null && !/^[A-Z]{3}$/.test(data.currency ?? ''))) {
            failures.push('Funding-options currency must be an ISO-style three-letter code or null.');
          }
          if (data && typeof data.message !== 'string') {
            failures.push('Funding-options response is missing its customer-facing explanation.');
          }
          const methods = data?.methods;
          for (const id of ['card', 'local', 'more']) {
            if (typeof methods?.[id] !== 'boolean') failures.push(`Funding-options method "${id}" must be an explicit boolean.`);
          }
          const flutterwave = data?.flutterwave;
          if (!flutterwave || typeof flutterwave.enabled !== 'boolean' ||
              (flutterwave.currency !== null && !/^[A-Z]{3}$/.test(flutterwave.currency ?? '')) ||
              !Array.isArray(flutterwave.paymentMethods) || !Array.isArray(flutterwave.mobileNetworks)) {
            failures.push('Funding-options Flutterwave customer-method summary is malformed.');
          } else {
            if (flutterwave.paymentMethods.some((method) => typeof method !== 'string' || !method.trim())) {
              failures.push('Funding-options payment method entries must be non-empty strings.');
            }
            if (new Set(flutterwave.paymentMethods).size !== flutterwave.paymentMethods.length) {
              failures.push('Funding-options payment method entries must be unique.');
            }
            if (flutterwave.mobileNetworks.some((network) =>
              !network || typeof network.network !== 'string' || !network.network.trim() ||
              typeof network.name !== 'string' || !network.name.trim())) {
              failures.push('Funding-options mobile network entries must contain a network id and display name.');
            }
          }
          // Provider identities, routing decisions, raw FX quotes and prices are
          // intentionally kept on the server. The public endpoint exposes only
          // customer-facing method availability and safe Flutterwave method hints.
          if (data && ['providers', 'provider', 'anyEnabled', 'fxRate', 'fxSource', 'fxUpdatedAt'].some((key) => Object.hasOwn(data, key))) {
            failures.push('Funding-options public response exposes server-only provider routing or FX metadata.');
          }
          if (failures.length) {
            for (const failure of failures) console.error(`FAIL: ${failure}`);
            process.exit(1);
          }
          console.log(`Funding-options public contract healthy; country=${data.countryCode ?? 'unresolved'}; currency=${data.currency ?? 'unavailable'}; customer methods=${Object.entries(methods).filter(([, enabled]) => enabled).map(([id]) => id).join(',') || 'none'}; Flutterwave enabled=${flutterwave.enabled}. Provider identities and pricing remain server-side.`);
          NODE

      - name: Check account session API
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status_code=""
          for attempt in 1 2 3 4; do
            status_code="$(curl --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --output /tmp/env-auth-session.json \
              --write-out '%{http_code}' \
              https://envtools.store/api/auth/get-session || true)"
            if [ "$status_code" = "200" ]; then break; fi
            sleep 3
          done
          echo "Auth session HTTP ${status_code:-000}"
          if [ "$status_code" != "200" ]; then
            AUTH_STATUS="$status_code" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          let body = {};
          try { body = JSON.parse(fs.readFileSync('/tmp/env-auth-session.json', 'utf8')); } catch {}
          console.error(`FAIL: Account session endpoint returned HTTP ${process.env.AUTH_STATUS || '000'}; public error code=${body?.error ?? 'unavailable'}.`);
          NODE
            exit 1
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const session = JSON.parse(fs.readFileSync('/tmp/env-auth-session.json', 'utf8'));
          if (session && typeof session !== 'object') {
            console.error('FAIL: Account session endpoint returned an unexpected response.');
            process.exit(1);
          }
          console.log(`Account session endpoint healthy; signed-in session=${Boolean(session?.user)}.`);
          NODE

      - name: Check optional AI status contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/env-ai-status.json \
            --write-out 'AI status HTTP %{http_code}; downloaded %{size_download} bytes\\n' \
            https://envtools.store/api/ai/status
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const status = JSON.parse(fs.readFileSync('/tmp/env-ai-status.json', 'utf8'));
          const entries = Object.entries(status.tasks ?? {});
          const available = entries.filter(([, task]) => task?.available === true).length;
          const reasons = entries.reduce((counts, [, task]) => {
            const reason = task?.available === true ? 'available' : (task?.reason ?? 'unspecified');
            counts[reason] = (counts[reason] ?? 0) + 1;
            return counts;
          }, {});
          const malformed = entries.filter(([, task]) =>
            !task || typeof task.available !== 'boolean' ||
            (task.available !== true && (typeof task.reason !== 'string' || !task.reason.trim()))
          );
          if (status.ok !== true || typeof status.enabled !== 'boolean' ||
              entries.length === 0 || malformed.length > 0 ||
              (status.enabled === false && available > 0)) {
            console.error(`FAIL: AI status contract is inconsistent. enabled=${status.enabled === true}; tasks=${entries.length}; available=${available}; malformed=${malformed.length}; task states=${JSON.stringify(reasons)}.`);
            process.exit(1);
          }
          // AI is optional. An installation with no provider credentials is a
          // healthy explicit state: all AI panels must remain hidden while
          // deterministic tools continue to work.
          console.log(`AI status contract healthy; master switch enabled=${status.enabled}; tasks=${entries.length}; available=${available}; task states=${JSON.stringify(reasons)}. Zero available tasks is valid only as an explicit reported state, not evidence that AI is usable.`);
          NODE
