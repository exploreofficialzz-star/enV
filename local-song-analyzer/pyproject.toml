[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "env-local-song-analyzer"
version = "1.0.0"
description = "Private, local song decoding, tagging and reviewed-label learning"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.162.0", "starlette==0.46.2", "uvicorn==0.54.0", "python-multipart==0.0.32",
  "numpy==2.2.5", "httpx==0.28.1", "librosa==0.11.0", "soundfile==0.13.1",
]

[project.optional-dependencies]
tagger = ["torch==2.6.0", "transformers==4.51.3"]
transcription = ["faster-whisper==1.1.1"]
stems = ["demucs==4.0.1", "torchaudio==2.6.0"]
test = ["pytest==8.3.5"]

[project.scripts]
env-song-analyzer = "song_analyzer.cli:main"

[tool.setuptools.packages.find]
include = ["song_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
